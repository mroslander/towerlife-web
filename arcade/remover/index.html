<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Remover — TowerLife Arcade</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .game-title {
      color: #ff3366;
      text-shadow: 0 0 12px #ff3366, 0 0 32px rgba(255,51,102,0.45);
      animation: arcade-pulse 2.4s ease-in-out infinite;
    }

    #canvas-wrapper { border: none; box-shadow: none; }

    #btn-mute {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="game-container">

    <!-- HUD ──────────────────────────────────────────────────────── -->
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="score"      class="hud-value" style="color:#ff3366">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">TILES</span>
        <span id="tiles-left" class="hud-value" style="color:#888;font-size:18px">81</span>
      </div>
      <div class="hud-item" style="align-items:flex-end">
        <span class="hud-label">BEST</span>
        <span id="high"       class="hud-value" style="color:#ffcc00">0</span>
      </div>
    </div>

    <!-- Canvas + overlays ────────────────────────────────────────── -->
    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
      <button id="btn-mute" class="btn-icon">🔊</button>

      <!-- Start overlay -->
      <div id="overlay-start" class="overlay">
        <h1 class="game-title">REMOVER</h1>
        <p class="overlay-hint">Tap a group of 2+ same-color tiles to select</p>
        <p class="overlay-hint">Tap it again to remove — bigger groups score exponentially more</p>
        <button id="btn-start" class="btn-primary">START</button>
        <p class="overlay-sub">Tap · Enter · Space</p>
      </div>

      <!-- Game over overlay -->
      <div id="overlay-over" class="overlay hidden">
        <h2 id="over-title">NO MORE MOVES</h2>
        <div class="overlay-scores">
          <div class="overlay-score-row">
            <span class="label">SCORE</span>
            <span id="final-score" class="value">0</span>
          </div>
          <div class="overlay-score-row">
            <span class="label">BEST</span>
            <span id="final-high"  class="value">0</span>
          </div>
          <div class="overlay-score-row">
            <span class="label">LEFT</span>
            <span id="final-left"  class="value">0</span>
          </div>
        </div>
        <button id="btn-restart" class="btn-primary">PLAY AGAIN</button>
        <p class="overlay-sub">Tap · Enter · Space</p>
      </div>
    </div>

  </div><!-- #game-container -->

  <script src="../common/save.js"></script>
  <script src="../common/towerlife.js"></script>
  <script src="../common/audio.js"></script>
  <script src="../common/achievements.js"></script>
  <script src="../common/ui.js"></script>
  <script src="remover.js"></script>
</body>
</html>
