<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ZigZagger — TowerLife Arcade</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    #game-container { gap: 0; padding: 0; }
    #canvas-wrapper { border: none; box-shadow: none; width: 100%; }
    #btn-mute {
      position: absolute; top: 8px; right: 8px; z-index: 10;
    }
  </style>
</head>
<body>

  <div id="game-container">

    <!-- Canvas + overlays ──────────────────────────────────── -->
    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
      <button id="btn-mute" class="btn-icon" title="Mute">🔊</button>
      <div id="overlay-start" class="overlay">
        <h1 class="game-title">ZIGZAGGER</h1>
        <p class="overlay-hint">Tap to change direction</p>
        <button id="btn-start" class="btn-primary">START</button>
        <p class="overlay-sub">Tap · Space · Enter to begin</p>
      </div>

      <!-- Game over screen -->
      <div id="overlay-over" class="overlay hidden">
        <h2>GAME OVER</h2>
        <div class="overlay-scores">
          <div class="overlay-score-row">
            <span class="label">SCORE</span>
            <span id="final-score" class="value">0</span>
          </div>
          <div class="overlay-score-row">
            <span class="label">BEST</span>
            <span id="final-high" class="value">0</span>
          </div>
        </div>
        <button id="btn-restart" class="btn-primary">PLAY AGAIN</button>
        <p class="overlay-sub">Tap · Space · Enter</p>
      </div>
    </div>

  </div><!-- #game-container -->

  <!-- Common libraries -->
  <script src="../common/save.js"></script>
  <script src="../common/towerlife.js"></script>
  <script src="../common/audio.js"></script>
  <script src="../common/achievements.js"></script>
  <script src="../common/ui.js"></script>
  <!-- Game -->
  <script src="zigzagger.js"></script>
</body>
</html>
