<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Merge 2048 — TowerLife Arcade</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    #canvas-wrapper {
      border: none;
      box-shadow: none;
      background: #0d0d0d;
    }

    /* Win overlay accent colour */
    #overlay-win .game-title {
      font-size: 48px;
      letter-spacing: 6px;
      color: #ffff44;
      text-shadow:
        0 0 12px #ffff44,
        0 0 32px rgba(255, 255, 68, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">

    <!-- HUD ──────────────────────────────────────────────────────── -->
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="score" class="hud-value">0</span>
      </div>

      <div>
        <button id="btn-mute" class="btn-icon" title="Mute">🔊</button>
      </div>

      <div class="hud-item" style="align-items:flex-end;">
        <span class="hud-label">BEST</span>
        <span id="high-score" class="hud-value">0</span>
      </div>
    </div>

    <!-- Canvas + overlays ───────────────────────────────────────── -->
    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>

      <!-- Start screen -->
      <div id="overlay-start" class="overlay">
        <h1 class="game-title">MERGE 2048</h1>
        <p class="overlay-hint" style="text-align:center;line-height:1.85;">
          <strong>Swipe</strong> to slide all tiles.<br>
          Two equal tiles <strong>merge</strong> into their sum.<br>
          <span style="color:#ffff44;">Reach 2048 to win!</span>
        </p>
        <button id="btn-start" class="btn-primary">START</button>
      </div>

      <!-- Win screen (keep playing or start over) -->
      <div id="overlay-win" class="overlay hidden">
        <h1 class="game-title">2048!</h1>
        <p class="overlay-hint" style="text-align:center;line-height:1.8;">
          You reached 2048 — keep going!
        </p>
        <div class="overlay-scores">
          <div class="overlay-score-row">
            <span class="label">SCORE</span>
            <span id="win-score" class="value">0</span>
          </div>
        </div>
        <button id="btn-continue" class="btn-primary">KEEP GOING</button>
        <button id="btn-new-from-win" class="btn-icon" style="margin-top:4px;font-size:12px;letter-spacing:2px;padding:6px 16px;">NEW GAME</button>
      </div>

      <!-- Game over screen -->
      <div id="overlay-over" class="overlay hidden">
        <h2>GAME OVER</h2>
        <div class="overlay-scores">
          <div class="overlay-score-row">
            <span class="label">SCORE</span>
            <span id="final-score" class="value">0</span>
          </div>
          <div class="overlay-score-row">
            <span class="label">BEST</span>
            <span id="final-high" class="value">0</span>
          </div>
        </div>
        <button id="btn-restart" class="btn-primary">PLAY AGAIN</button>
      </div>
    </div>

  </div><!-- #game-container -->

  <!-- Common libraries -->
  <script src="../common/save.js"></script>
  <script src="../common/towerlife.js"></script>
  <script src="../common/audio.js"></script>
  <script src="../common/achievements.js"></script>
  <script src="../common/ui.js"></script>
  <!-- Game -->
  <script src="merge.js"></script>
</body>
</html>
