<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TowerLife Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 48px 16px 32px;
    }

    .arcade-title {
      font-size: 36px;
      letter-spacing: 10px;
      color: #00ff88;
      text-shadow: 0 0 16px rgba(0, 255, 136, 0.5);
      text-transform: uppercase;
    }

    .arcade-sub {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 3px;
      color: #444;
      text-transform: uppercase;
    }

    /* ── Game grid ───────────────────────────────────────────── */
    #game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }

    /* ── Game card ───────────────────────────────────────────── */
    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px 16px;
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      text-decoration: none;
      color: inherit;
      background: #111;
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }

    .game-card:hover:not(.coming-soon) {
      border-color: #00ff88;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.12);
    }

    .game-card:focus-visible {
      outline: 2px solid #00ff88;
      outline-offset: 2px;
    }

    .game-card.coming-soon {
      opacity: 0.4;
      cursor: default;
    }

    .card-title {
      font-size: 18px;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
    }

    .game-card:hover:not(.coming-soon) .card-title {
      color: #00ff88;
    }

    .card-desc {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 9px;
      letter-spacing: 1px;
      color: #444;
      border: 1px solid #2a2a2a;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 10px;
      letter-spacing: 1px;
      color: #2a2a2a;
    }
  </style>
</head>
<body>

  <header>
    <div class="arcade-title">Arcade</div>
    <div class="arcade-sub">Tower Life · Minigames</div>
  </header>

  <main>
    <div id="game-grid"></div>
  </main>

  <footer>Tower Life &copy; 2024</footer>

  <script src="arcade.js"></script>
</body>
</html>
